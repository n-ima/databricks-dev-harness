name: Copilot setup steps
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml, package-lock.json]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml, package-lock.json]
permissions:
  contents: read
jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Set up contract-test Python (not Databricks Runtime)
        id: contract-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify selected Python
        run: python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version; print(sys.version)"
      - run: npm ci --ignore-scripts
      - run: npm run harness:check
      - run: npm run test:harness
        env:
          HARNESS_TEST_PYTHON: ${{ steps.contract-python.outputs.python-path }}
      # No Databricks credentials in the coding environment. Online validation uses a separately reviewed OIDC job.
