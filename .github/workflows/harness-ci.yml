name: Harness conformance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up pinned Node action
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Set up contract-test Python (not Databricks Runtime)
        id: contract-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify selected Python
        run: python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version; print(sys.version)"
      - name: Verify locked Node dependencies
        run: npm ci --ignore-scripts
      - name: Check harness structure and generated agent assets
        run: npm run harness:check
      - name: Test routing and safety hooks
        env:
          HARNESS_TEST_PYTHON: ${{ steps.contract-python.outputs.python-path }}
        run: npm run test:harness
